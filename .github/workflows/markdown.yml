name: Markdown

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint Markdown
        run: >-
          npx --yes markdownlint-cli2@0.22.1
          README.md
          ACCESSIBILITY_CHECKLIST.md
          CONTRIBUTING.md
          .github/pull_request_template.md
